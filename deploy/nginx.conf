server {
    listen 443 ssl;
    server_name jobflow.example.com;
    root /var/www/jobflow/Public;
    index index.php;
    autoindex off;
    client_max_body_size 12m;

    # Configure your real TLS certificate and key here.
    ssl_certificate /etc/ssl/jobflow/fullchain.pem;
    ssl_certificate_key /etc/ssl/jobflow/privkey.pem;

    location / {
        try_files $uri /index.php?$query_string;
    }

    location ~ ^/\.(?!well-known) {
        deny all;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 180s;
    }

    location ~ \.php$ {
        return 404;
    }
}
