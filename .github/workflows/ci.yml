name: Verify Synapse

on:
    pull_request:
    workflow_call:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    verify:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                database: ['mysql:8.4', 'mariadb:10.11']
        services:
            database:
                image: ${{ matrix.database }}
                env:
                    MYSQL_ROOT_PASSWORD: synapse-ci-only
                    MYSQL_ROOT_HOST: '%'
                    MYSQL_DATABASE: jobflow_test
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping -h 127.0.0.1 -psynapse-ci-only || mariadb-admin ping -h 127.0.0.1 -psynapse-ci-only"
                    --health-interval=5s --health-timeout=5s --health-retries=30
        env:
            APP_ENV: test
            APP_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
            APP_URL: http://127.0.0.1:8848
            SESSION_SECURE: 'false'
            DB_HOST: 127.0.0.1
            DB_PORT: '3306'
            DB_DATABASE: jobflow_test
            DB_USERNAME: root
            DB_PASSWORD: synapse-ci-only
            DB_SOCKET: ''
            JOBFLOW_TEST_DATABASE: jobflow_test
            DOCUMENT_STORAGE: local
            SMTP_PASSWORD: ''
            GEMINI_API_KEY: ''
            DOCUMENT_RENDERER_URL: ''
            DOCUMENT_RENDERER_TOKEN: ''
        steps:
            - uses: actions/checkout@v6
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.3'
                  extensions: curl, dom, fileinfo, mbstring, openssl, pdo_mysql, sodium, zip
                  tools: composer:v2
                  coverage: none
            - uses: actions/setup-node@v6
              with:
                  node-version: '24'
                  cache: npm
            - run: composer install --no-interaction --prefer-dist
            - run: npm ci
            - name: Prepare application assets
              run: |
                  npm run build:pdf
                  npm run build:css
            - name: Validate PHP and deployment transport
              run: |
                  composer lint
                  python3 -m unittest discover -s tests -p deployment.py
                  php tests/migrations.php
            - name: Verify application behaviour
              run: composer test
            - name: Install Chromium
              if: matrix.database == 'mysql:8.4'
              run: npx playwright install --with-deps chromium
            - name: Verify browser workflows
              if: matrix.database == 'mysql:8.4'
              run: |
                  node tests/browser.mjs
                  node tests/saas-browser.mjs
                  node tests/alpine-browser.mjs
                  node tests/google-signin-browser.mjs
                  node tests/entry-browser.mjs
                  node tests/document-preview-browser.mjs
                  node tests/document-retention-browser.mjs
                  node --test tests/fuzu-browser.mjs
            - name: Verify production packaging
              run: |
                  composer install --no-dev --classmap-authoritative --no-interaction --prefer-dist
                  python3 scripts/release.py build
